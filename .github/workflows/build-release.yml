name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - runtime: linux-x64
            suffix: linux-x64
          - runtime: win-x64
            suffix: win-x64
          - runtime: osx-x64
            suffix: osx-x64
          - runtime: osx-arm64
            suffix: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore Jitzu.slnx

      - name: Publish jz
        run: |
          dotnet publish Jitzu.Shell/Jitzu.Shell.csproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            -o ./publish/${{ matrix.suffix }}

      - name: Install 7z
        if: matrix.runtime == 'win-x64'
        run: sudo apt-get install -y p7zip-full

      - name: Create ZIPs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd publish/${{ matrix.suffix }}
          if [ "${{ matrix.runtime }}" = "win-x64" ]; then
            7z a -tzip ../jitzu-${VERSION}-${{ matrix.suffix }}.zip jz.exe
          else
            zip ../jitzu-${VERSION}-${{ matrix.suffix }}.zip jz
          fi

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jitzu-${{ matrix.suffix }}
          path: publish/jitzu-${{ steps.version.outputs.version }}-${{ matrix.suffix }}.zip
          retention-days: 1

  build-arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed git unzip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jitzu-linux-x64
          path: packaging/arch

      - name: Build pacman package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=0.0.0-dev
          fi
          HASH=$(sha256sum "packaging/arch/jitzu-${VERSION}-linux-x64.zip" | cut -d' ' -f1)
          bash .github/scripts/update-arch-package.sh "$VERSION" "$HASH"
          cp LICENSE packaging/arch/LICENSE
          # makepkg refuses to run as root. Cached sources avoid a dependency
          # on the release existing before the package has been built.
          useradd --create-home builder
          chown -R builder:builder packaging/arch
          cd packaging/arch
          runuser -u builder -- env PKGEXT=.pkg.tar.zst makepkg --cleanbuild --noconfirm
          runuser -u builder -- makepkg --printsrcinfo > SRCINFO
          bsdtar -tf ./*.pkg.tar.zst
          bsdtar -xOf ./*.pkg.tar.zst usr/share/licenses/jz-bin/LICENSE | cmp - LICENSE
          bsdtar -xOf ./*.pkg.tar.zst usr/bin/jz | cmp - src/jz
          runuser -u builder -- ./src/jz --version

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: jitzu-arch-x86_64
          path: |
            packaging/arch/*.pkg.tar.zst
            packaging/arch/PKGBUILD
            packaging/arch/SRCINFO
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.pkg.tar.zst
          name: Jitzu ${{ steps.version.outputs.version }}
          draft: false
          body: |
            ## Downloads

            Choose your platform below:
            - **jitzu-${{ steps.version.outputs.version }}-linux-x64.zip** - Linux (x64)
            - **jitzu-${{ steps.version.outputs.version }}-win-x64.zip** - Windows (x64)
            - **jitzu-${{ steps.version.outputs.version }}-osx-x64.zip** - macOS (Intel)
            - **jitzu-${{ steps.version.outputs.version }}-osx-arm64.zip** - macOS (Apple Silicon)
            - **jz-bin-*-x86_64.pkg.tar.zst** - Arch Linux (x64), install with `sudo pacman -U ./jz-bin-*-x86_64.pkg.tar.zst`

            ## What's Inside

            Each zip contains `jz` — the unified Jitzu interpreter and shell.

            ## Quick Start

            ### Linux / macOS
            ```bash
            unzip jitzu-${{ steps.version.outputs.version }}-*.zip
            chmod +x jz
            ./jz           # interactive shell
            ./jz script.jz # run a script
            ```

            ### Windows
            ```powershell
            Expand-Archive jitzu-${{ steps.version.outputs.version }}-win-x64.zip
            .\jz.exe           # interactive shell
            .\jz.exe script.jz # run a script
            ```

            ### Package Managers

            ```bash
            # Windows (Scoop)
            scoop bucket add jitzu https://github.com/jitzulang/jitzu
            scoop install jz

            # Arch Linux (AUR)
            yay -S jz-bin
            ```

            The pacman download is a standalone package, not a configured repository.
            Install later releases with `pacman -U`; `pacman -Syu` will not discover
            them automatically. AUR updates remain available through an AUR helper.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-arch-repository:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    concurrency:
      group: jitzu-arch-repository
      cancel-in-progress: false
    steps:
      - name: Check publication secrets
        id: secrets
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
          ARCH_GPG_PASSPHRASE: ${{ secrets.ARCH_GPG_PASSPHRASE }}
          ARCH_GPG_FINGERPRINT: ${{ secrets.ARCH_GPG_FINGERPRINT }}
        run: |
          missing=()
          for name in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY ARCH_GPG_PRIVATE_KEY ARCH_GPG_PASSPHRASE ARCH_GPG_FINGERPRINT; do
            [[ -n ${!name} ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::warning::Repository publication skipped; missing secrets: ${missing[*]}"
            echo "Repository publication skipped; missing secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install repository tools
        if: steps.secrets.outputs.ready == 'true'
        run: pacman -Syu --noconfirm --needed git aws-cli gnupg
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: jitzu-arch-x86_64
          path: arch-artifact
      - name: Sign and publish repository
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
          ARCH_GPG_PASSPHRASE: ${{ secrets.ARCH_GPG_PASSPHRASE }}
          ARCH_GPG_FINGERPRINT: ${{ secrets.ARCH_GPG_FINGERPRINT }}
        run: bash .github/scripts/publish-arch-repository.sh arch-artifact

  update-scoop:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download win-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jitzu-win-x64
          path: artifacts

      - name: Compute SHA256
        id: hash
        run: |
          HASH=$(sha256sum artifacts/jitzu-${{ steps.version.outputs.version }}-win-x64.zip | cut -d' ' -f1)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Update Scoop manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          HASH=${{ steps.hash.outputs.sha256 }}
          cat > bucket/jz.json << MANIFEST
          {
            "version": "${VERSION}",
            "architecture": {
              "64bit": {
                "url": "https://github.com/jitzulang/jitzu/releases/download/v${VERSION}/jitzu-${VERSION}-win-x64.zip",
                "hash": "${HASH}"
              }
            },
            "bin": "jz.exe",
            "checkver": {
              "github": "https://github.com/jitzulang/jitzu"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/jitzulang/jitzu/releases/download/v\$version/jitzu-\$version-win-x64.zip"
                }
              }
            }
          }
          MANIFEST
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/jz.json
          git commit -m "Update Scoop manifest to v${VERSION}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          exit 1

  update-aur:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download built Arch recipe and metadata
        uses: actions/download-artifact@v4
        with:
          name: jitzu-arch-x86_64
          path: arch-artifact

      - name: Commit Arch recipe
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp arch-artifact/PKGBUILD packaging/arch/PKGBUILD
          cp arch-artifact/SRCINFO packaging/arch/.SRCINFO
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          git commit -m "Update PKGBUILD to v${VERSION}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          exit 1

      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: .github/scripts/publish-aur.sh "${{ steps.version.outputs.version }}"

  update-winget:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve version
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download win-x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jitzu-win-x64
          path: artifacts

      - name: Compute SHA256
        id: hash
        run: |
          HASH=$(sha256sum artifacts/jitzu-${{ steps.version.outputs.version }}-win-x64.zip | cut -d' ' -f1)
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"

      - name: Update local WinGet manifests
        run: |
          VERSION=${{ steps.version.outputs.version }}
          HASH=${{ steps.hash.outputs.sha256 }}
          URL="https://github.com/jitzulang/jitzu/releases/download/v${VERSION}/jitzu-${VERSION}-win-x64.zip"

          cat > packaging/winget/JitzuLang.Jitzu.yaml <<EOF
          PackageIdentifier: JitzuLang.Jitzu
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.9.0
          EOF
          sed -i 's/^          //' packaging/winget/JitzuLang.Jitzu.yaml

          cat > packaging/winget/JitzuLang.Jitzu.installer.yaml <<EOF
          PackageIdentifier: JitzuLang.Jitzu
          PackageVersion: ${VERSION}
          InstallerType: zip
          NestedInstallerType: portable
          NestedInstallerFiles:
            - RelativeFilePath: jz.exe
              PortableCommandAlias: jz
          Installers:
            - Architecture: x64
              InstallerUrl: ${URL}
              InstallerSha256: ${HASH}
          ManifestType: installer
          ManifestVersion: 1.9.0
          EOF
          sed -i 's/^          //' packaging/winget/JitzuLang.Jitzu.installer.yaml

          sed -i "s/^PackageVersion: .*/PackageVersion: ${VERSION}/" packaging/winget/JitzuLang.Jitzu.locale.en-US.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/winget/
          git commit -m "Update WinGet manifests to v${VERSION}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed; retrying..."
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
